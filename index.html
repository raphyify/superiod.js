<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Superiod | Composable UI styling</title>
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
<main class="shell">
    <section class="intro">
        <p class="eyebrow">A tiny styling system for vanilla JavaScript</p>
        <h1>Build one visual language.<br/><em>Extend it everywhere.</em></h1>
        <p class="lede">Superiod keeps your widgets consistent while leaving room for purposeful variations. <button class="-download-button">Download Now!</button></p>
        <div class="signal"><span></span> Live component preview</div>
    </section>
    <section class="preview" aria-labelledby="preview-title">
        <div class="preview-heading">
            <div>
                <p class="eyebrow">Widget studio</p>
                <h2 id="preview-title">A contact panel in three lines of setup</h2>
            </div>
            <span class="version">superiod / 1.0</span>
        </div>
        <div id="app"></div>
    </section>
</main>
<script type="module" src="./superiod/superiod.js"></script>
<script type="module" src="index.js"></script>
</body>

</html>
